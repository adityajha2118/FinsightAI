# ──────────────────────────────────────────────────────────
# FinSight AI — Agent Configuration
# ──────────────────────────────────────────────────────────

llm:
  provider: "gemini"  # "gemini" or "openai"
  
  gemini:
    model: "gemini-1.5-flash"
    temperature: 0.3
    max_tokens: 500

  openai:
    model: "gpt-4o-mini"
    temperature: 0.3
    max_tokens: 500

agent:
  complaint:
    enabled: true
    max_retries: 2
    timeout_seconds: 30
    fallback_response: >
      Thank you for bringing this to our attention. We take your concern
      seriously and a member of our team will contact you shortly to
      resolve this matter.

  routing_rules:
    critical_threshold: 0.90
    high_threshold: 0.80
    anger_escalation_threshold: 0.60
    critical_emotions:
      - "Legal Threat"
      - "Distress"
