[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finsight-ai"
version = "1.0.0"
description = "Unified Customer Intelligence & Retention Analytics Platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Aditya Jha"},
]
keywords = [
    "fintech",
    "machine-learning",
    "generative-ai",
    "agentic-ai",
    "customer-intelligence",
    "churn-prediction",
    "compliance",
    "langraph",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/adityajha2118/AMEX_FinsightAI"
Documentation = "https://github.com/adityajha2118/AMEX_FinsightAI/tree/main/docs"
Repository = "https://github.com/adityajha2118/AMEX_FinsightAI"
"Bug Tracker" = "https://github.com/adityajha2118/AMEX_FinsightAI/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ── Linting & Formatting ────────────────────────────────

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ── Testing ──────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "api: API endpoint tests",
    "slow: Tests that take > 10s",
]
